---
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          scrape_interval: "5s"
          static_configs:
            - targets: ["spicedb:9090"]

processors:
  # TODO: filter
  batch:
  memory_limiter:
    check_interval: 5s
    limit_mib: 4000
    spike_limit_mib: 500
  metricstransform:
    transforms:
      - include: spicedb_cache_hits_total
        action: update
        new_name: rocksdb_block_cache_hits
      - include: spicedb_cache_misses_total
        action: update
        new_name: rocksdb_block_cache_misses
  filter:
    metrics:
      metric:
        - 'name != "spicedb_cache_hits_total" and name != "spicedb_cache_misses_total"'

exporters:
  prometheus:
    endpoint: "0.0.0.0:9090"
    enable_open_metrics: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors:
        - filter
        - memory_limiter
        - batch
        - metricstransform
      exporters: [prometheus]
